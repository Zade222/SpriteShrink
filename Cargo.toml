[workspace]
resolver = "3"
members = [
    "crates/cli_application",
    "crates/lib_sprite_shrink",
    "crates/lib_ss_cd",
    "crates/test_support",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

#Lints

[workspace.lints.rust]
unsafe_op_in_unsafe_fn          = "warn"
missing_debug_implementations   = "warn"
redundant_imports               = "warn"
redundant_lifetimes             = "warn"
unused_lifetimes                = "warn"
trivial_numeric_casts           = "warn"
ambiguous_negative_literals     = "warn"

[workspace.lints.clippy]
cargo       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
suspicious  = { level = "warn", priority = -1 }

#Restriction lints

#Don't Panic
string_slice               = "warn"
indexing_slicing           = "warn"
unwrap_used                = "warn"
get_unwrap                 = "warn"
unwrap_in_result           = "warn"
panic_in_result_fn         = "warn"
panic                      = "warn"
unchecked_time_subtraction = "warn"
todo                       = "warn"
unimplemented              = "warn"
unreachable                = "warn"

#Don't Fail Silently
let_underscore_future       = "warn"
let_underscore_must_use     = "warn"
unused_result_ok            = "warn"
map_err_ignore              = "warn"
assertions_on_result_states = "warn"

#Async Safety
await_holding_lock          = "warn"
await_holding_refcell_ref   = "warn"
large_futures               = "warn"

#Numeric Correctness
float_cmp                   = "warn"
float_cmp_const             = "warn"
lossy_float_literal         = "warn"
cast_sign_loss              = "warn"
cast_possible_truncation    = "warn"
cast_possible_wrap          = "warn"
cast_precision_loss         = "warn"
invalid_upcast_comparisons  = "warn"

#Unsafe Discipline
undocumented_unsafe_blocks     = "warn"
multiple_unsafe_ops_per_block  = "warn"
mem_forget                     = "warn"
unnecessary_safety_doc         = "warn"
unnecessary_safety_comment     = "warn"

#Suppress Suppression Abuse
allow_attributes               = "warn"
allow_attributes_without_reason = "warn"

#Consistency and Correctness
rc_mutex                    = "warn"
debug_assert_with_mut_call  = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy     = "warn"
infallible_try_from         = "warn"
dbg_macro                   = "warn"

#Microsoft guidelines additions
clone_on_ref_ptr            = "warn"
empty_drop                  = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any      = "warn"
if_then_some_else_none      = "warn"
redundant_type_annotations  = "warn"
renamed_function_params     = "warn"
semicolon_outside_block     = "warn"
string_to_string            = "warn"
unneeded_field_pattern      = "warn"

#Suppress this one — it conflicts with structured logging patterns
# (tracing's message template syntax looks like formatting args)
literal_string_with_formatting_args = "allow"
